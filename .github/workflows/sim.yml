#
# Lint + simulation + cocotb regression. Mirrors `python build_and_test.py`.
# With GHDL installed it also covers the VHDL port: PHASE 0d (GHDL analysis
# and elaboration for every vendor target) and PHASE 2b (the cocotb suites on
# the VHDL). The formal proofs of the port run in parity.yml.

name: sim

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sim:
    # Pinned: Ubuntu 24.04's GHDL is 4.1, the version the port is proven and
    # simulated with (GHDL 6 behaves differently, see docs/vhdl_port.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator ghdl
          iverilog -V | head -1
          verilator --version
          # Fails the step if GHDL is missing; build_and_test.py would only
          # skip the VHDL phases.
          ghdl --version | head -1

      - name: Check HDL tool versions
        # apt cannot pin these reliably (an Ubuntu update drops the old
        # version from the index), so fail loudly instead. If this fails,
        # Ubuntu updated a tool: rerun the full regression and the parity
        # proofs on the new version, then update the expected versions here.
        run: |
          for p in iverilog=12.0-2build2 verilator=5.020-1 ghdl=4.1.0+dfsg-0ubuntu2.1; do
            got=$(dpkg-query -W -f='${Version}' "${p%%=*}")
            [ "$got" = "${p#*=}" ] || { echo "::error::${p%%=*} is $got, expected ${p#*=}"; exit 1; }
          done

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.17'

      - name: Install cocotb
        # Icarus and GHDL (installed above) are cocotb's simulator backends.
        # Without this the cocotb phases (PHASE 2 and 2b) would skip silently
        # instead of running.
        run: |
          pip install -r .github/requirements/sim.txt
          python -c "import cocotb; print('cocotb', cocotb.__version__)"

      - name: Run lint + simulation + cocotb (Verilog and VHDL)
        run: python build_and_test.py
