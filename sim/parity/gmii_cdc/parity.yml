# translateHDL parity manifest: rtl/gmii_cdc.v (golden) vs rtl/vhdl/gmii_cdc.vhd.
# Run (needs ghdl + yosys): python <translateHDL>/scripts/parity.py sim/parity/gmii_cdc/parity.yml --strict
#
# FIFO model. gmii_cdc hard-codes a 16K-word (ADDR_WIDTH 14) TX async_fifo and
# sizes the RX one from MAX_FRAME (4K-16K words). memory_map turns those arrays
# into flops, far past what SAT handles, and the TX depth cannot be overridden
# without editing the golden. So both sides link against a parity model of
# async_fifo instead of rtl/async_fifo.v / rtl/vhdl/async_fifo.vhd:
# async_fifo_smallmem.{v,vhd} is the real FIFO with only the memory array
# clamped to 8 words. Pointers, Gray syncs, full/empty and wr_data_count keep
# their real widths, so gmii_cdc runs at its real parameters and every
# occupancy-dependent branch (tx_busy at TX_START_LIMIT, the 4095 level
# saturation, rx_data_room at DEPTH-2, the 15-bit frame counters) is in the
# proof. The argument has three parts:
#   1. async_fifo.v == async_fifo.vhd           sim/parity/async_fifo/ (small depths)
#   2. smallmem .v == smallmem .vhd             module `async_fifo` below, at the
#                                               configs gmii_cdc instantiates
#   3. gmii_cdc.v == gmii_cdc.vhd over (2)      modules gmii_cdc* below
# Not covered: gmii_cdc with the full-depth array in place.
#
# Configs: eth_mac_sys instantiates gmii_cdc with FIFO_RAM_STYLE = CDC_RAM_STYLE
# ("BLOCK" default; nothing in the repo overrides it) and MAX_FRAME 9018
# (default, RX ADDR_WIDTH 14) or 1518 (RX ADDR_WIDTH 12); both are proven.
# FIFO_RAM_STYLE = "DISTRIBUTED" is not instantiated and is not proven here:
# gmii_cdc only forwards the string to async_fifo, whose DISTRIBUTED branch is
# proven in sim/parity/async_fifo/. A one-instance wrapper pinning it trips a
# Yosys 0.63 `rename -unescape` assertion (GHDL names the wrapper's nets
# u_cdc.u_rx_fifo_wr_full and flatten adds u_cdc.u_rx_fifo.wr_full; both
# unescape to the same name).
version: 1
name: gmii_cdc_parity
description: gmii_cdc Verilog golden vs VHDL port (FIFO_RAM_STYLE BLOCK, 8-word FIFO memory model)

golden:
  language: verilog
  top: gmii_cdc
  sources:
    - async_fifo_smallmem.v
    - ../async_fifo/async_fifo_block.v
    - ../../../rtl/gmii_cdc.v

candidate:
  language: vhdl
  std: "08"
  top: gmii_cdc
  sources:
    - ../../../rtl/vhdl/emz_util_pkg.vhd
    - async_fifo_smallmem.vhd
    - ../async_fifo/async_fifo_block.vhd
    - ../../../rtl/vhdl/gmii_cdc.vhd

interface:
  top: gmii_cdc

formal:
  enabled: true
  engine: yosys
  induct_depth: 20
  bounded_depth: 30
  modules:
    # (2) the FIFO model pair, at the depths gmii_cdc instantiates
    - name: async_fifo
      param_sets:
        - {DATA_WIDTH: 10, ADDR_WIDTH: 14}
        - {DATA_WIDTH: 10, ADDR_WIDTH: 12}
    - name: async_fifo_block
      param_sets:
        - {DATA_WIDTH: 10, ADDR_WIDTH: 14}
        - {DATA_WIDTH: 10, ADDR_WIDTH: 12}
    # (3) gmii_cdc itself
    - name: gmii_cdc
      param_sets:
        - {}
        - {MAX_FRAME: 1518}

synth:
  enabled: true
  tolerance_pct: 10.0
  param_sets:
    - {}
