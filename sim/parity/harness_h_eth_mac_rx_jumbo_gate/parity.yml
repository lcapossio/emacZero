# translateHDL parity manifest: cocotb harness
# sim/cocotb/hdl/h_eth_mac_rx_jumbo_gate.v (golden) vs h_eth_mac_rx_jumbo_gate.vhd,
# flattened with eth_mac_tx and both eth_mac_rx instances.
# Run (needs ghdl + yosys): python <translateHDL>/scripts/parity.py sim/parity/harness_h_eth_mac_rx_jumbo_gate/parity.yml --strict
#
# The harness backs the cocotb port of tb_eth_mac_rx_jumbo_gate. eth_mac_tx
# and eth_mac_rx are proven on their own in sim/parity/eth_mac_tx and
# sim/parity/eth_mac_rx; this proof covers the harness wiring (shared loopback
# inputs, the bench's tie-offs, u_rx2's MAX_FRAME_JUMBO 1518) in composition.
# AXIS_FIFO_ADDR_WIDTH is cut from 11 to 3 for the solver, as in
# sim/parity/eth_mac_rx.
version: 1
name: harness_h_eth_mac_rx_jumbo_gate_parity
description: h_eth_mac_rx_jumbo_gate cocotb harness, Verilog golden vs VHDL (flattened)

golden:
  language: verilog
  top: h_eth_mac_rx_jumbo_gate
  sources:
    - ../../../rtl/crc32.v
    - ../../../rtl/sync_fifo.v
    - ../../../rtl/net/csum_calc.v
    - ../../../rtl/eth_mac_rx.v
    - ../../../rtl/eth_mac_tx.v
    - ../../cocotb/hdl/h_eth_mac_rx_jumbo_gate.v

candidate:
  language: vhdl
  std: "93"
  top: h_eth_mac_rx_jumbo_gate
  sources:
    - ../../../rtl/vhdl/crc32.vhd
    - ../../../rtl/vhdl/sync_fifo.vhd
    - ../../../rtl/vhdl/csum_calc.vhd
    - ../../../rtl/vhdl/eth_mac_rx.vhd
    - ../../../rtl/vhdl/eth_mac_tx.vhd
    - ../../cocotb/hdl/h_eth_mac_rx_jumbo_gate.vhd

interface:
  top: h_eth_mac_rx_jumbo_gate

formal:
  enabled: true
  engine: yosys
  induct_depth: 20
  bounded_depth: 30
  modules:
    - name: h_eth_mac_rx_jumbo_gate
      param_sets:
        - {AXIS_FIFO_ADDR_WIDTH: 3}

synth:
  enabled: true
  tolerance_pct: 10.0
  param_sets:
    - {AXIS_FIFO_ADDR_WIDTH: 11}
