# translateHDL parity manifest: rtl/eth_mac_tx.v (golden) vs rtl/vhdl/eth_mac_tx.vhd.
# Run (needs ghdl + yosys): python <translateHDL>/scripts/parity.py sim/parity/eth_mac_tx/parity.yml --strict
# Proves the MAX_FRAME values the design instantiates (1518 standard, 9018
# jumbo default of eth_mac / eth_mac_sys, 60 for eth_mac_sys's control-frame
# framer). No RAM, so no shrinking needed.
version: 1
name: eth_mac_tx_parity
description: eth_mac_tx Verilog golden vs VHDL port

golden:
  language: verilog
  top: eth_mac_tx
  sources: [../../../rtl/eth_mac_tx.v]

candidate:
  language: vhdl
  std: "93"
  top: eth_mac_tx
  sources: [../../../rtl/vhdl/eth_mac_tx.vhd]

interface:
  top: eth_mac_tx

formal:
  enabled: true
  engine: yosys
  induct_depth: 20
  bounded_depth: 30
  modules:
    - name: eth_mac_tx
      param_sets:
        - {MAX_FRAME: 1518}
        - {MAX_FRAME: 9018}
        - {MAX_FRAME: 60}

synth:
  enabled: true
  tolerance_pct: 10.0
  param_sets:
    - {MAX_FRAME: 9018}
