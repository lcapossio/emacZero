# translateHDL parity manifest: rtl/net/udp_iperf_sink.v (golden) vs
# rtl/vhdl/udp_iperf_sink.vhd.
# Run (needs ghdl + yosys): python <translateHDL>/scripts/parity.py sim/parity/udp_iperf_sink/parity.yml --strict
#
# LISTEN_PORT is a 16-bit vector (a std_logic_vector generic in the VHDL),
# which translateHDL cannot set from a manifest. Two proofs:
#   - udp_iperf_sink at its default LISTEN_PORT = 0 (accept every port);
#   - udp_iperf_sink_p5001, a one-instance wrapper pair in this directory with
#     LISTEN_PORT = 5001, the value arty_a7_top, zcu106_eth_demo and the bench
#     use. With 0 the port compare folds away, so this is the proof that covers
#     it.
version: 1
name: udp_iperf_sink_parity
description: udp_iperf_sink Verilog golden vs VHDL port (LISTEN_PORT 0 and 5001)

golden:
  language: verilog
  top: udp_iperf_sink
  sources: [../../../rtl/net/udp_iperf_sink.v, udp_iperf_sink_p5001.v]

candidate:
  language: vhdl
  std: "93"
  top: udp_iperf_sink
  sources: [../../../rtl/vhdl/udp_iperf_sink.vhd, udp_iperf_sink_p5001.vhd]

interface:
  top: udp_iperf_sink

formal:
  enabled: true
  engine: yosys
  induct_depth: 8
  modules:
    - name: udp_iperf_sink
    - name: udp_iperf_sink_p5001

synth:
  enabled: true
  tolerance_pct: 10.0
