# translateHDL parity manifest: fpga/arty_a7/rtl/gmii_lb_selftest.v (golden) vs
# fpga/arty_a7/rtl/gmii_lb_selftest.vhd, XILINX_7SERIES target (the Arty build).
# Run (needs ghdl + yosys): python <translateHDL>/scripts/parity.py sim/parity/gmii_lb_selftest/parity.yml --strict
#
# Stand-ins, read identically by both sides:
#   - eth_mac_sys -> ../sfp_lb_tester/eth_mac_sys_standin.{v,vhd}. eth_mac_sys
#     is proven on its own in sim/parity/eth_mac_sys and is not flattened in
#     here. The stand-in has its name, generics and ports; it is a register
#     that mixes every input and a fingerprint of every generic, and drives
#     every output from its own register bit (no combinational path, so the
#     GMII loopback makes no loop). So this proof covers gmii_lb_selftest's own
#     logic, the wiring of every eth_mac_sys port (including the loopback) and
#     the generic values (MAX_FRAME 9018, RX_AXIS_ADDR_WIDTH left at its
#     default), not the MAC. In the induction step the MAC outputs take
#     arbitrary values.
#   - MMCME2_BASE, BUFG -> xilinx_clk_prims_standin.{v,vhd}: CLKOUT0 follows
#     CLKIN1 (gated by the closed feedback loop), BUFG is a wire, LOCKED comes
#     from a register mixing PWRDWN and a fingerprint of the four MMCM
#     parameters. They check the wiring and generic values around the
#     primitives, not the primitives.
#
# Target: XILINX_7SERIES on both sides (defines/xilinx_7series.vh,
# emz_target_xilinx_7series.vhd). Every non-SIM target takes the same MMCM
# branch. The SIM branch (`ifdef SIM: a free-running `always #4` clock and
# mmcm_locked = rst_n) is not synthesizable and is not proven; it only
# replaces the clock source, the rest of the module is shared.
#
# No parameters. The generator/checker counters are proven at full width;
# equiv_induct pairs them by name and does not unroll them.
version: 1
name: gmii_lb_selftest_parity
description: gmii_lb_selftest Verilog golden vs VHDL port, XILINX_7SERIES, eth_mac_sys and clock primitives replaced by stand-ins

golden:
  language: verilog
  top: gmii_lb_selftest
  sources:
    - ../defines/xilinx_7series.vh
    - xilinx_clk_prims_standin.v
    - ../sfp_lb_tester/eth_mac_sys_standin.v
    - ../../../fpga/arty_a7/rtl/gmii_lb_selftest.v

candidate:
  language: vhdl
  std: "93"
  top: gmii_lb_selftest
  sources:
    - ../../../rtl/vhdl/target/emz_target_xilinx_7series.vhd
    - ../../../rtl/vhdl/emz_util_pkg.vhd
    - xilinx_clk_prims_standin.vhd
    - ../sfp_lb_tester/eth_mac_sys_standin.vhd
    - ../../../fpga/arty_a7/rtl/gmii_lb_selftest.vhd

interface:
  top: gmii_lb_selftest

formal:
  enabled: true
  engine: yosys
  induct_depth: 20
  modules:
    - name: gmii_lb_selftest
      param_sets:
        - {}

# L4: +10.5% cells (GHDL: one $and per condition term and one $eq per case
# choice, where Yosys uses $logic_and / $reduce_and); flop bits identical (595).
synth:
  enabled: true
  tolerance_pct: 15.0
  param_sets:
    - {}
