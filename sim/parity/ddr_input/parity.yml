# translateHDL parity manifest: rtl/ddr_input.v (golden) vs rtl/vhdl/ddr_input.vhd.
# SIM target (`define SIM / emz_target_sim.vhd). parity_<target>.yml prove the other
# EMZ_TARGET branches.
# Run (needs ghdl + yosys): python <translateHDL>/scripts/parity.py sim/parity/ddr_input/parity.yml --strict
version: 1
name: ddr_input_parity_sim
description: ddr_input Verilog golden vs VHDL port, SIM behavioural branch

golden:
  language: verilog
  top: ddr_input
  sources: [../defines/sim.vh, ../../../rtl/ddr_input.v]

candidate:
  language: vhdl
  std: "08"
  top: ddr_input
  sources: [../../../rtl/vhdl/target/emz_target_sim.vhd, ../../../rtl/vhdl/ddr_input.vhd]

interface:
  top: ddr_input

formal:
  enabled: true
  engine: yosys
  induct_depth: 8
  modules:
    - name: ddr_input

synth:
  enabled: true
  tolerance_pct: 10.0
