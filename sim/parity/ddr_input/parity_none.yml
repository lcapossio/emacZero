# translateHDL parity manifest: rtl/ddr_input.v (golden) vs rtl/vhdl/ddr_input.vhd.
# No target (no define / emz_target_none.vhd): q1 and q2 are deliberately left undriven
# on both sides, so there is no logic to prove. L2 is off because it cannot
# run: the golden module is then port-only, which Yosys treats as a black box
# ("Can't find gold module gold"). GHDL synthesizes the undriven VHDL port as
# 1'bZ, the value an undriven Verilog wire has. L0 (ports), L1 (both sides
# analyse) and L4 (0 cells on both sides) still run.
# Run (needs ghdl + yosys): python <translateHDL>/scripts/parity.py sim/parity/ddr_input/parity_none.yml --strict
version: 1
name: ddr_input_parity_none
description: ddr_input Verilog golden vs VHDL port, no target (output deliberately undriven)

golden:
  language: verilog
  top: ddr_input
  sources: [../../../rtl/ddr_input.v]

candidate:
  language: vhdl
  std: "08"
  top: ddr_input
  sources: [../../../rtl/vhdl/target/emz_target_none.vhd, ../../../rtl/vhdl/ddr_input.vhd]

interface:
  top: ddr_input

formal:
  enabled: false
  engine: yosys
  induct_depth: 8
  modules:
    - name: ddr_input

synth:
  enabled: true
  tolerance_pct: 10.0
