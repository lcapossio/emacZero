# translateHDL parity manifest: rtl/ddr_input.v (golden) vs rtl/vhdl/ddr_input.vhd.
# INTEL_CYCLONE target (`define INTEL_CYCLONE / emz_target_intel_cyclone.vhd).
# Run (needs ghdl + yosys): python <translateHDL>/scripts/parity.py sim/parity/ddr_input/parity_intel_cyclone.yml --strict
version: 1
name: ddr_input_parity_intel_cyclone
description: ddr_input Verilog golden vs VHDL port, INTEL_CYCLONE behavioural branch

golden:
  language: verilog
  top: ddr_input
  sources: [../defines/intel_cyclone.vh, ../../../rtl/ddr_input.v]

candidate:
  language: vhdl
  std: "93"
  top: ddr_input
  sources: [../../../rtl/vhdl/target/emz_target_intel_cyclone.vhd, ../../../rtl/vhdl/ddr_input.vhd]

interface:
  top: ddr_input

formal:
  enabled: true
  engine: yosys
  induct_depth: 8
  modules:
    - name: ddr_input

synth:
  enabled: true
  tolerance_pct: 10.0
