# translateHDL parity manifest: rtl/net/udp_echo.v (golden) vs rtl/vhdl/udp_echo.vhd.
# Run (needs ghdl + yosys): python <translateHDL>/scripts/parity.py sim/parity/udp_echo/parity.yml --strict
# udp_echo has no submodules. Its payload buffer (BUF_SIZE bytes: 1536 on
# both boards, 1024 by default) is turned into flops by memory_map, so the
# formal proof runs at small power-of-two sizes (8 and 16). The RTL is
# parametric in BUF_SIZE.
# A BUF_SIZE that is not a power of two (like 1536) leaves addresses past
# the buffer: in TX_PAYLOAD the ADDR_W-bit read index can reach them, and the
# Verilog reads x there. That IS reachable: a payload of exactly
# 2^(ADDR_W+1) bytes (4096 at BUF_SIZE 1536, a ZCU106 jumbo frame) wraps the
# ADDR_W+1-bit payload_len to 0, the end-of-reply compare never matches, and
# the reply runs on through the whole address space until reset - a Verilog
# bug, reproduced as-is (docs/vhdl_port.md). The VHDL reads 0 past the end,
# one legal value of the x. Yosys folds the x to a single value instead
# (translateHDL BUG-066), so the udp_echo proof uses udp_echo_x0.v as its
# golden: the real udp_echo.v with that one read returning 8'h00 past the
# end, generated by sim/parity/gen_goldens.py (--check in build_and_test
# phase 0d). BUF_SIZE 6 covers the non-power-of-two case.
# Writes are guarded (rx_cnt < BUF_SIZE) on both sides and do prove.
# LISTEN_PORT is a [15:0] vector parameter (std_logic_vector generic), which
# translateHDL param sets cannot set, so the nonzero-port branch (both boards
# use 9999) goes through a one-instance wrapper per side
# (udp_echo_listen.{v,vhd}) that takes the port as an integer. udp_echo
# itself is proven at the default LISTEN_PORT = 0 (echo every port).
# L4 runs at the production sizes.
version: 1
name: udp_echo_parity
description: udp_echo Verilog golden vs VHDL port (LISTEN_PORT 0 and 9999)

golden:
  language: verilog
  top: udp_echo
  sources: [../../../rtl/net/udp_echo.v, udp_echo_x0.v, udp_echo_listen.v]

candidate:
  language: vhdl
  std: "93"
  top: udp_echo
  sources: [../../../rtl/vhdl/emz_util_pkg.vhd, ../../../rtl/vhdl/udp_echo.vhd,
            udp_echo_listen.vhd]

interface:
  top: udp_echo

formal:
  enabled: true
  engine: yosys
  induct_depth: 20
  bounded_depth: 30
  modules:
    - name: udp_echo
      golden_top: udp_echo_x0
      candidate_top: udp_echo
      param_sets:
        - {BUF_SIZE: 6}
        - {BUF_SIZE: 8}
        - {BUF_SIZE: 16}
    - name: udp_echo_listen
      param_sets:
        - {BUF_SIZE: 8, LPORT: 9999}

synth:
  enabled: true
  tolerance_pct: 10.0
  param_sets:
    - {}
    - {BUF_SIZE: 1536}
