# translateHDL parity manifest: fpga/arty_a7/rtl/test_sequencer.v (golden) vs
# fpga/arty_a7/rtl/test_sequencer.vhd.
# Run (needs ghdl + yosys): python <translateHDL>/scripts/parity.py sim/parity/test_sequencer/parity.yml --strict
# The timers (300M/200M/100M/500k cycles, 1024-cycle MDIO poll) are hard-wired
# constants; CLK_FREQ is declared but never used, so there is no small-timer
# setting. None is needed: wait_cnt and mdio_poll_cnt are paired state that
# both sides advance identically, so equiv_induct closes without the solver
# ever reaching a timeout. The CLK_FREQ = 125 MHz set only checks the generic
# plumbing.
# The ARP frame ROM (42 words, read as arp_frame[arp_idx] with an 8-bit
# arp_idx) reads x past word 41. That index is unreachable, but induction starts
# from arbitrary state, and translateHDL takes a Verilog x as the one value
# Yosys folds it to (translateHDL BUG-066). L2 therefore proves the VHDL
# against test_sequencer_x0.v, generated by ../gen_goldens.py from the real
# Verilog with only that read changed to return 0 past word 41 (a refinement
# of the x, and what the VHDL returns). L0, L1 and L4 use the real module.
#   python sim/parity/gen_goldens.py --check   (build_and_test phase 0d)
version: 1
name: test_sequencer_parity
description: test_sequencer (Arty A7 self-test FSM) Verilog golden vs VHDL port

golden:
  language: verilog
  top: test_sequencer
  sources: [../../../fpga/arty_a7/rtl/test_sequencer.v, test_sequencer_x0.v]

candidate:
  language: vhdl
  std: "93"
  top: test_sequencer
  sources: [../../../fpga/arty_a7/rtl/test_sequencer.vhd]

interface:
  top: test_sequencer

formal:
  enabled: true
  engine: yosys
  induct_depth: 20
  bounded_depth: 30
  modules:
    - name: test_sequencer
      golden_top: test_sequencer_x0
      candidate_top: test_sequencer
      param_sets:
        - {}
        - {CLK_FREQ: 125000000}

# L4 tolerance is wider than the 10% default (+12.3% measured: 398 golden vs
# 447 candidate cells). GHDL lowers the 63-way state `case` to a one-hot
# decode of `state`, so the $eq count doubles (65 -> 127) while $ne/$mux/
# $logic_and drop. Flip-flops match exactly: 258 bits on both sides after
# `proc; flatten; memory; opt -full` (36 vs 34 $adff/$adffe cells, the same
# bits sliced differently). L2 is the equivalence proof.
synth:
  enabled: true
  tolerance_pct: 15.0
  param_sets:
    - {}
